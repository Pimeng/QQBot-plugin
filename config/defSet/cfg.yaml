# QQBot（QQ 官方机器人）适配器默认配置
# 用户配置写在同目录 config/config/cfg.yaml（首次加载从本文件复制生成），改本文件无效。
tips:
  - 欢迎使用 QQBot Plugin（Miao-Yunzai 适配版）
  - 仓库：https://github.com/Pimeng/QQBot-plugin
  - 数据存 data/QQBot 下的 json；WebHook 端口与公网地址见本文件 webhookPort / url
# 指令权限（master / admin / 主人QQ号 等，交给 miao 的权限系统判断）
permission: master
# 把消息里的链接转成二维码（true / false / 正则）
toQRCode: true
# 是否把 markdown 消息里的链接转成回调
toCallback: true
# 是否允许把图片先上传到 QQ 官方素材库再发送
toBotUpload: true
# 频道撤回消息时是否对所有人隐藏
hideGuildRecall: false
# 图片压缩阈值（MB），0 表示不压缩（未安装 sharp 时自动关闭）
imageLength: 3
markdown:
  # markdown 模板 id（QQ 开放平台「模板」里配置的原始 id）
  template: abcdefghij
# 发送模式：auto（默认，只有显式 markdown / 按钮才走 markdown，其余硬拆成普通消息）
#           markdown（强制所有消息走 markdown）/ text（始终普通消息）
# 也可按机器人 QQ 号覆盖：sendMode: { default: auto, "3889013403": markdown }
sendMode:
  default: auto
bot:
  # 是否使用沙箱环境（sandbox.api.sgroup.qq.com）
  sandbox: false
  # 断线重连次数
  maxRetry: 3
  # 请求超时（毫秒）
  timeout: 30000
  # 连接超时（握手阶段，毫秒）
  connectTimeout: 30000
  # 断线重连基础间隔，按次数递增（毫秒）
  retryDelay: 5000
# 手动指定 intents，留空则按账号类型自动生成并逐级降级
# 例：["GROUP_AT_MESSAGE_CREATE", "C2C_MESSAGE_CREATE", "INTERACTION"]
intents: []
# 额外的主人（官方 Bot 的 user_id 是 openid，无法用 QQ 号匹配时用 #QQBot绑定用户）
master: []
# 引用回复（被动回复）策略：
#   auto（默认）有 message_id 就引用；被 QQ 拒绝后 5 分钟内改用主动消息，到期自动恢复
#   true  始终作为主动消息发送（不加引用）
#   false 始终按被动回复发（失败就失败）
activeMsg: auto
# 是否转义 markdown 语法字符（颜文字被误解析时保持 true；需要原始 markdown 时设为 false）
escapeMarkdown: true
# WebHook 监听端口，0 表示不启用；公网需自行反代到 /QQBot
webhookPort: 0
# 公网地址，用于把图片等文件转成可被 QQ 拉取的直链，如 https://bot.example.com
url: ""
# 账号列表：只填开放平台的 AppID / AppSecret 这两个值
#   uin      机器人QQ号，账号标识；省略时用 appid 顶替
#   appid    开放平台 AppID（必填）
#   secret   开放平台 AppSecret（必填）；在 q.qq.com 重置后要同步改这里
#   group    是否群Bot，默认 true（群聊 / C2C 私聊 intents）
#   guild    是否频道私域，默认 false（频道 GUILD intents）
#   webhook  true 走 WebHook（需同时配 webhookPort + 公网 url），默认 false 走 WebSocket
#
#   accounts:
#     - uin: 3889013403
#       appid: 102091829
#       secret: 在 q.qq.com「开发设置」里拿到的 AppSecret
accounts: []
# 旧写法（只有 #QQBot设置 指令写过的历史数据会落在这一项，含义与 accounts 相同）：
#   机器人QQ号:AppID:Token:AppSecret:是否群Bot:是否频道私域
# 第 3 段 Token 是 v1 时代凭证，现在取 access_token 只认 appid + secret，填什么都行；
# 两种写法同时存在时，同一个机器人以 accounts 为准
token: []
